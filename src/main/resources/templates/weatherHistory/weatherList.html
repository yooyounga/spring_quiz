<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="utf-8">
    <title></title>
    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</head>
<body>
<div class="container">
		<h1 th:text="'과거날씨'"></h1>
		<table class="table text-center">
			<thead>
				<tr>
					<th>날짜</th>
					<th>날씨</th>
					<th>기온</th>
					<th>강수량</th>
					<th>미세먼지</th>
					<th>풍속</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="weatherhis : ${weather}">
					<!-- <td th:text="${#temporals.format(weatherhis.date,'yyyy년 M월 d일')}"></td> -->
					<td th:text="${weatherhis.date}"></td>
					<td th:switch="${weatherhis.weather}">
						<img th:case="'맑음'" src="/img/sunny.jpg"></img>
						<img th:case="'비'" src="/img/rainy.jpg"></img>
						<img th:case="'구름조금'" src="/img/partlyCloudy.jpg"></img>
						<img th:case="'흐림'" src="/img/cloudy.jpg"></img>
						<span th:case="*" th:text="${weatherhis.weather}"></span>
					</td>
					<td th:text="${weatherhis.temperatures+'°C'}">C</td>
					<td th:text="|${weatherhis.precipitation}mm|"></td>
					<td th:text="${weatherhis.microDust}"></td>
					<td th:text="${weatherhis.windSpeed+'km/h'}">km/h</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
